# Local development stack for the Avin API.
#
#   docker compose up --build
#
# Starts the FastAPI server on http://localhost:8080 (health: /health, docs: /docs).
# A Firestore emulator service is included but commented out — uncomment it once
# the Firestore backend lands (task 2.3.1).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Inject API keys here to enable auth locally (empty = auth disabled).
      # AVIN_API_KEYS: "dev-key-1,dev-key-2"
      # GCP project for Vertex AI (transcription/reasoning) when running live.
      # AVIN_GCP_PROJECT_ID: "your-project-id"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # --- Optional: local Firestore emulator (enable with task 2.3.1) ---
  # firestore:
  #   image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
  #   command: >
  #     gcloud emulators firestore start
  #     --host-port=0.0.0.0:8200
  #   ports:
  #     - "8200:8200"
