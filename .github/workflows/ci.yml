name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # sounddevice loads the native PortAudio library at import time, even
      # though tests mock it — the shared lib must be present on the runner.
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Install the CPU-only torch build first so the editable install below
      # resolves torch/torchaudio without pulling the multi-GB CUDA wheels.
      - name: Install CPU torch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest, mocks only — no live APIs)
        run: pytest --cov=src/assistant --cov-report=term-missing --cov-fail-under=80
