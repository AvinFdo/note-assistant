# config/default.yaml — all tunables. Override via AVIN_* env vars or AVIN_CONFIG_PATH.

# --- Google Cloud ---
gcp:
  project_id: "project-7255c67e-8145-4cdd-ae1"
  region: "us-central1"

# --- AI Models ---
models:
  transcription: "gemini-2.5-flash"    # Model used for audio-to-text
  reasoning: "gemini-2.5-flash"        # Model used for note/action extraction
  embedding: "text-embedding-004"      # Model used for semantic note embeddings (retrieval)

# --- Audio ---
audio:
  sample_rate: 16000          # Hz — 16kHz is optimal for speech
  channels: 1                 # Mono — sufficient for speech, saves bandwidth
  format: "int16"             # 16-bit PCM
  recordings_dir: "recordings"
  default_duration: 10        # Seconds for fixed-duration recording (avin listen)

# --- Voice Activity Detection ---
vad:
  enabled: true
  model: "silero"
  threshold: 0.5              # Confidence threshold (0.0-1.0), higher = less sensitive
  min_speech_duration_ms: 250 # Minimum speech duration to trigger processing
  silence_duration_ms: 1500   # Silence duration to consider speech segment complete
  buffer_duration_s: 3.0      # Rolling buffer size in seconds (captures pre-speech audio)

# --- Context & Memory ---
memory:
  db_path: "data/assistant.db"
  context_window_size: 5      # Number of recent conversations to include in LLM prompt
  max_context_tokens: 4000    # Approximate token budget for context in the prompt
  min_transcript_words: 10    # Transcripts with fewer words skip the LLM call entirely
  backend: "sqlite"           # Storage backend: sqlite | firestore (firestore for Cloud Run)
  embed_notes: false          # Embed each saved note for semantic retrieval (2.3.2). Off until rollout.

# --- Actions ---
actions:
  confidence_threshold: 0.7   # Actions below this are logged, not executed
  create_todo:
    mode: "auto_execute"      # Safe — just creates a to-do item
  send_email:
    mode: "confirm_first"     # Dangerous — never auto-send emails
  add_calendar:
    mode: "confirm_first"     # Could disrupt schedule
  research_topic:
    mode: "auto_execute"      # Safe — just queues for research

# --- Integrations (Stage 2) ---
integrations:
  obsidian:
    vault_path: ""            # Absolute path to a LOCAL Obsidian vault (CLI use)
    notes_folder: "assistant" # Subfolder within vault for assistant notes
    # GitHub-backed vault for cloud deployments (Cloud Run can't reach a local
    # vault). The backend commits daily markdown to this repo via the Contents
    # API; open the repo as an Obsidian vault to sync notes across devices.
    github_repo: ""           # "owner/repo" of the vault repository
    github_branch: "main"     # Branch to commit notes to
    # github_token is a SECRET — never set it here. Inject at runtime via the
    # AVIN_OBSIDIAN_GITHUB_TOKEN env var (fine-grained PAT, Contents:write).
  google:
    oauth_credentials_path: "" # Path to OAuth2 client secret JSON

# --- API Authentication ---
# Leave api_keys EMPTY for local development (auth disabled when no keys are set).
# In production, inject keys via the AVIN_API_KEYS environment variable
# (comma-separated), e.g. AVIN_API_KEYS="key1,key2"
# NEVER commit real keys here.
api:
  api_keys: []  # e.g. ["key1", "key2"] — empty means auth disabled
  proxy_secret: ""  # shared secret the Cloudflare Worker injects as X-Proxy-Secret; empty disables the check (set AVIN_API_PROXY_SECRET in prod)
